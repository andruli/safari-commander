<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Safari Commander</title>
  <link rel="stylesheet" href="../Style.css">
  <script src="../Script.js" defer></script>
</head>
<body>
  <img src="../Icon.png" width="72" height="72" alt="">
  <h1>Safari Commander</h1>
  <p class="subtitle">A little less clicking. A little more flow.</p>
  <div class="shortcut"><kbd>⌘</kbd><kbd>K</kbd></div>
  <p class="intro">Find a tab. Open a page. Run a command.<br>Your next move is a few letters away.</p>
  <p id="state" role="status">Enable Commander in Safari to get started.</p>
  <button class="open-preferences">Open Safari Settings…</button>
  <p class="footnote">Enable the extension, then allow website access<br>on the sites where you want to use Commander.</p>
</body>
</html>
